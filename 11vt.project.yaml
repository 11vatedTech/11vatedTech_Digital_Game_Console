    # (CTest fixture + selftest, PACKAGED marker, QR1 ok/ok). Milestone
    # status: evidence/milestones/DK0-M3-status.json.
    # remainder = production signing trust anchor (unsigned dev mode
    # documented); §36 controller walk against the installed package.
  - id: DK0-M4
    name: Fidelity Lab (VFR proof)
    status: implemented  # 2026-09-12: ADR-0026 fidelity stack (contract,
    # compiler 648→592→187 Pareto byte-deterministic, binding-axis governor,
