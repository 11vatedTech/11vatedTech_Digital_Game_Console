      system RAM, storage type and benchmark, display modes, HDR data, VRR
      feasibility, audio endpoints, GameInput devices, Secure Boot/TPM state,
      sustained performance probe.
  - id: DK0-M2
    name: Console Session
    status: runtime-verified  # 2026-09-10: substrate RUNTIME_VERIFIED incl.
    # §39 topology reaction, typed launch contract (ADR-0024), §K dedup,
    # QR1 lifecycle + audio-topology reaction. 14/14 CTest green.
    # remainder = physical controller-only acceptance walk (§36) + input-loss
    # walk (§38) — needs a controller attached (software side complete).
  - id: DK0-M3
    name: Minimal native title (.11g)
    status: runtime-verified  # 2026-09-10: ADR-0025 package contract
