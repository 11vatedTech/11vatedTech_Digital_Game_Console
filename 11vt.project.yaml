  - id: DK0-M5
    name: Certification runner
    status: pending

validation:
  build: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 && cmake --build build --config Release
  tests: ctest --test-dir build -C Release --output-on-failure
  contract: python scripts/validate/contract_tests.py
  qualify: build/Release/dc-hostprof.exe --qualify quick --out evidence/qualification/qualification-summary.json

constraints:
  - Canon authority: docs/canon/DC-CANON-001.md — no silent contradictions
  - First executable is dc-hostprof, not the shell (canon §50)
  - Windows Host Edition = bootstrap host; ConsoleOS = long-term appliance host
  - Truth classification required on all roadmap claims
